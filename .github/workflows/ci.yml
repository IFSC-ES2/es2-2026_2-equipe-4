name: CI

on:
  pull_request:
    branches:
      - main
      - 'entrega-*'

permissions:
  contents: read

jobs:
  documentos:
    name: Documentos obrigatórios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir documentos obrigatórios
        run: ls README.md USO-IA.md docs/inception.md docs/dod.md

  links:
    name: Links internos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir links dos arquivos Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md'

  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rodar markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            #avaliacao


#testes backend

  backend-tests:
    name: Backend (Spring Boot + Gradle)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Permissão de execução no Gradle Wrapper
        run: chmod +x src/backend/projetos/gradlew

      - name: Rodar Testes de Unidade
        env:
          SPRING_MONGODB_URI: mongodb://localhost:27017/testdb
        run: |
          cd src/backend/projetos
          ./gradlew test

#testes frontend

  frontend-tests:
    name: Frontend (React + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/frontend
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ./src/frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Rodar testes de interface
        run: npm run test -- --run

# Builda o backend 

  backend-build:
    name: Backend (Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Configurar Java JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Permissão de execução no Gradle Wrapper
        run: chmod +x src/backend/projetos/gradlew
      - name: Buildar projeto backend
        run: |
          cd src/backend/projetos
          ./gradlew build -x test

# Builda o frontend

  frontend-build:
    name: Frontend (Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/frontend
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ./src/frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Buildar projeto frontend
        run: npm run build

# Valida o Docker: o compose builda e sobe com o modelo .env.example

  docker:
    name: Docker (Compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Criar o .env a partir do modelo
        run: cp .env.example .env
      - name: Buildar e subir os serviços
        run: docker compose up -d --build --wait
      - name: Conferir que a API responde
        run: curl --fail --retry 20 --retry-delay 3 --retry-all-errors http://localhost:8080/api/v1/auth/status
