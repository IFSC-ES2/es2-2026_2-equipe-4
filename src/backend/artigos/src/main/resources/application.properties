spring.application.name=artigos

# Porta da API
server.port=8080

# endpoint padrão
server.servlet.context-path=/api/v1

# Configurações de rotas invalidas
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false


# configurações do banco de dados
# Essa configuração é basica e pode ser alterada de acordo com a necessidade do projeto
# é possivel adicionar mais propriedades de configuração do banco de dados, como pool de conexões, timeout, etc.
spring.data.mongodb.uri=mongodb://admin:admin123@localhost:27017/seu_banco?authSource=admin