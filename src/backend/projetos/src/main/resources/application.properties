spring.application.name=projetos

# Porta da API
server.port=8080

# endpoint padrão
server.servlet.context-path=/api/v1

app.api.version=0.0.1
app.api.users.base=/users
app.api.users.create-account=/createAccount



# Configurações de rotas invalidas
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false


# configurações do banco de dados
# Essa configuração é basica e pode ser alterada de acordo com a necessidade do projeto
# é possivel adicionar mais propriedades de configuração do banco de dados, como pool de conexões, timeout, etc.
spring.mongodb.uri=mongodb://admin:admin123@127.0.0.1:27017/publicaifsc?authSource=admin



# Autenticação e autorização
# JWT: segredo HS256 com pelo menos 32 bytes. Em produção, substitua por variável de ambiente.
app.jwt.secret=${JWT_SECRET:chave-super-forte-impossivel-de-adivinhar-1234567890}
# 1 hora
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}