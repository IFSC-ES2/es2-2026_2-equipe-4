# Versão previa, deve ser adiciona volume e mais configurações para o MongoDB
# Apenas para teste e conexão com a API 

# ===========

# Proximos containers a serem adicionados:
# - API
# - Frontend

# Dessa forma toda aplicação pode ser iniciada com apenas um comando: docker-compose up -d

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://admin:admin123@localhost:27017/admin?authSource=admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./src/backend/projetos
    container_name: projetos-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      APP_SEED_PROJETOS_ENABLED: "true"
      SPRING_MONGODB_URI: mongodb://admin:admin123@mongodb:27017/publicaifsc?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
    container_name: projetos-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongodb_data:  